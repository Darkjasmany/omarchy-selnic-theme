# ============================================================================
# SelNic — Starship
#
# Prompt del tema SelNic. Los colores salen solo de la paleta de colors.toml.
# El carmesí (#E33E43) queda para el error y para el acento de la ventana
# activa, igual que en el resto del escritorio.
#
# El archivo viaja dentro del tema. Un hook de Omarchy puede enlazar
# ~/.config/starship.toml con la copia activa del tema y restaurar la
# configuración anterior al cambiar a un tema sin starship.toml.
#
# Los símbolos de la sección "Nerd Font" son el preset oficial de Starship
# (nerd-font-symbols.toml). Están todos, aunque el formato solo use unos pocos,
# para que cualquier módulo que se active más adelante ya tenga su icono.
# ============================================================================

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 200
palette = "selnic"
format = "[$directory$git_branch$git_status]($style)$character"

# Paleta SelNic. Starship resuelve los nombres de estilo ("blue", "magenta"...)
# contra esta tabla, así que los módulos de abajo no repiten ni un hex.
[palettes.selnic]
background = "#101C27"
foreground = "#DCE5EC"
muted = "#4A6070"
red = "#E33E43"
orange = "#FF9057"
yellow = "#F5C451"
green = "#57C08A"
cyan = "#4FC5DB"
blue = "#5AA3D6"
magenta = "#E07A97"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[✗](bold red)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
read_only = " 󰌾"
style = "bold blue"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "italic magenta"

[git_status]
format     = '[$all_status]($style)'
style      = "yellow"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""

